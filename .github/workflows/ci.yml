name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld nasm \
            qemu-system-x86 \
            xorriso mtools gdisk \
            curl git make

      - name: Build HDD image
        run: make hdd MODE=${{ matrix.mode }} ARCH=x86_64 EXTRA_CFLAGS="-DCI_BUILD"

      - name: Smoke test
        timeout-minutes: 3
        run: |
          BUILD_DIR="build/x86_64/${{ matrix.mode }}"
          OVMF_DIR="deps/ovmf"

          set +e
          timeout 30 qemu-system-x86_64 \
            -M q35 -m 2G -cpu max -smp 4 \
            -M accel=tcg,smm=off \
            -drive if=pflash,format=raw,readonly=on,file="${OVMF_DIR}/OVMF_CODE.fd" \
            -drive if=pflash,format=raw,readonly=on,file="${OVMF_DIR}/OVMF_VARS.fd" \
            -drive file="${BUILD_DIR}/yerp.hdd",format=raw \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -debugcon file:"${BUILD_DIR}/e9_output.txt" \
            -display none \
            -no-reboot \
            -d int -D "${BUILD_DIR}/qemu_log.txt"
          EXIT_CODE=$?
          set -e

          echo "QEMU exit code: ${EXIT_CODE}"
          echo ""
          cat "${BUILD_DIR}/e9_output.txt" 2>/dev/null || echo "(no output)"

          if [ "${EXIT_CODE}" -eq 1 ]; then
            echo ""
            echo "All tests passed."
            exit 0
          elif [ "${EXIT_CODE}" -eq 3 ]; then
            echo ""
            echo "::error::CI tests failed."
            exit 1
          elif [ "${EXIT_CODE}" -eq 124 ]; then
            echo ""
            echo "::error::QEMU timed out."
            echo ""
            echo "*** Interrupt log ***"
            tail -50 "${BUILD_DIR}/qemu_log.txt" 2>/dev/null || true
            exit 1
          else
            echo ""
            echo "::error::QEMU exited unexpectedly with code ${EXIT_CODE}"
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.mode }}
          path: |
            build/x86_64/${{ matrix.mode }}/e9_output.txt
            build/x86_64/${{ matrix.mode }}/qemu_log.txt
          retention-days: 7
